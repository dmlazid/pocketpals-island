name: Build installable APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      POCKETPALS_KEYSTORE: ${{ github.workspace }}/.ci-signing/debug.keystore
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore installation signing key
        id: signing
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.POCKETPALS_KEYSTORE }}
          key: pocketpals-install-key-v2
      - name: Initialize signing key once
        if: steps.signing.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$(dirname "$POCKETPALS_KEYSTORE")"
          keytool -genkeypair -keystore "$POCKETPALS_KEYSTORE" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=PocketPals Test, O=PocketPals, C=PH"
      - name: Save signing key before building
        if: steps.signing.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.POCKETPALS_KEYSTORE }}
          key: pocketpals-install-key-v2
      - name: Verify signing key exists
        run: test -s "$POCKETPALS_KEYSTORE"
      - run: gradle assembleDebug --no-daemon
      - name: Read built version and verify signature
        id: meta
        run: |
          python3 - <<'PY'
          import json, os, shutil
          from pathlib import Path
          metadata = json.loads(Path("app/build/outputs/apk/debug/output-metadata.json").read_text())
          element = metadata["elements"][0]
          version = element["versionName"]
          filename = f"PocketPals-Island-{version}.apk"
          shutil.copyfile(Path("app/build/outputs/apk/debug") / element["outputFile"], filename)
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"version={version}\napk={filename}\n")
          PY
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "${{ steps.meta.outputs.apk }}"
          keytool -exportcert -keystore "$POCKETPALS_KEYSTORE" -storepass android -alias androiddebugkey -file signing-certificate.der
          sha256sum signing-certificate.der > signing-certificate.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: PocketPals-Island-${{ steps.meta.outputs.version }}
          path: ${{ steps.meta.outputs.apk }}
      - name: Preserve original releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view v1.0.0 >/dev/null 2>&1; then
            gh run download 38269482499 -n PocketPals-Island-APK -D old-v1.0.0
            mv old-v1.0.0/PocketPals-Island.apk old-v1.0.0/PocketPals-Island-1.0.0.apk
            gh release create v1.0.0 old-v1.0.0/PocketPals-Island-1.0.0.apk --target 71a7bfe2a9ccdc6991dae031ff8efbe123775de3 --title "PocketPals Island v1.0.0" --notes "Original test build, archived unchanged. Uses an old signing certificate; do not install over newer versions." --prerelease --latest=false
          fi
          if ! gh release view v1.1.0 >/dev/null 2>&1; then
            gh run download 38271950945 -n PocketPals-Island-APK -D old-v1.1.0
            mv old-v1.1.0/PocketPals-Island.apk old-v1.1.0/PocketPals-Island-1.1.0.apk
            gh release create v1.1.0 old-v1.1.0/PocketPals-Island-1.1.0.apk --target 68c127c91c1c52b90ddf614e3917efaa655b831b --title "PocketPals Island v1.1.0" --notes "Artwork and native media test build, archived unchanged. This version has the old signing-key persistence problem. Prefer v1.1.1 or newer." --prerelease --latest=false
          fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.meta.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: PocketPals Island v${{ steps.meta.outputs.version }}
          body: Versioned test APK. v1.1.1 fixes the signing-key path and retention. Uninstall v1.0 or v1.1 once before installing v1.1.1; saved pet data resets. Later builds must retain this signing key. Native Hyper Island appearance still needs device testing.
          prerelease: true
          files: |
            ${{ steps.meta.outputs.apk }}
            signing-certificate.sha256
          make_latest: false
