name: Build installable APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore installation signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: pocketpals-debug-signing-v1
      - run: gradle assembleDebug --no-daemon
      - run: cp app/build/outputs/apk/debug/app-debug.apk PocketPals-Island.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PocketPals-Island-APK
          path: PocketPals-Island.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: PocketPals Island 1.1.0 — artwork and native access check
          body: Download PocketPals-Island.apk below. Version 1.1.0 adds illustrated pets, new scenes, a smaller floating pet, and Xiaomi native-island access checking. Native mode requires permission granted by HyperOS; it is not guaranteed and does not bypass system restrictions. Floating mode is separate. On-device testing is still required.
          prerelease: true
          files: PocketPals-Island.apk
          make_latest: false
