name: Build installable APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      POCKETPALS_KEYSTORE: ${{ runner.temp }}/pocketpals-signing/debug.keystore
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore installation signing key
        id: signing
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.POCKETPALS_KEYSTORE }}
          key: pocketpals-install-key-v2
      - name: Initialize signing key once
        if: steps.signing.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$(dirname "$POCKETPALS_KEYSTORE")"
          keytool -genkeypair -keystore "$POCKETPALS_KEYSTORE" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=PocketPals Test, O=PocketPals, C=PH"
      - name: Save signing key before building
        if: steps.signing.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.POCKETPALS_KEYSTORE }}
          key: pocketpals-install-key-v2
      - name: Verify signing key exists
        run: test -s "$POCKETPALS_KEYSTORE"
      - run: gradle assembleDebug --no-daemon
      - name: Verify APK signature and record public fingerprint
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk
          keytool -exportcert -keystore "$POCKETPALS_KEYSTORE" -storepass android -alias androiddebugkey -file signing-certificate.der
          sha256sum signing-certificate.der > signing-certificate.sha256
          cp app/build/outputs/apk/debug/app-debug.apk PocketPals-Island-1.1.1.apk
      - run: cp app/build/outputs/apk/debug/app-debug.apk PocketPals-Island.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PocketPals-Island-APK
          path: PocketPals-Island.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: PocketPals Island 1.1.1 — installation signing fix
          body: Version 1.1.1 fixes signing-key persistence. Older 1.0 and 1.1 installs use a different certificate and need a one-time uninstall before installation; this resets saved pet data. Future builds must retain this key. Includes native rain media, native permission checking, improved pets, and floating mode. Device compatibility still requires testing.
          prerelease: true
          files: |
            PocketPals-Island.apk
            PocketPals-Island-1.1.1.apk
            signing-certificate.sha256
          make_latest: false
