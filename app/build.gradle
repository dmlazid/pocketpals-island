plugins { id 'com.android.application' }
android {
 namespace 'com.pocketpals.island'
 compileSdk 35
 defaultConfig { applicationId 'com.pocketpals.island'; minSdk 26; targetSdk 35; versionCode 3; versionName '1.1.1' }
 signingConfigs {
  debug {
   if (System.getenv('POCKETPALS_KEYSTORE')) {
    storeFile file(System.getenv('POCKETPALS_KEYSTORE'))
    storePassword 'android'
    keyAlias 'androiddebugkey'
    keyPassword 'android'
   }
  }
 }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
